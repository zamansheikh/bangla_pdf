name: bangla_pdf
description: >-
  Correct Bangla (Bengali) text in PDFs: real OpenType shaping for conjuncts,
  reph and vowel signs, with text that copies back out as clean Unicode.
version: 1.1.0
homepage: https://github.com/zamansheikh/bangla_pdf
issue_tracker: https://github.com/zamansheikh/bangla_pdf/issues
documentation: https://github.com/zamansheikh/bangla_pdf/wiki

screenshots:
  - description: 'bangla_pdf Preview'
    path: preview/preview.png

topics:
  - pdf
  - bangla
  - unicode
  - typography
  - text-shaping

environment:
  sdk: ^3.5.4
  flutter: '>=3.3.0'

dependencies:
  flutter:
    sdk: flutter
  pdf: ^3.11.3
  plugin_platform_interface: ^2.1.8
  

dev_dependencies:
  flutter_test:
    sdk: flutter
  lint: ^2.8.0


flutter:

    
